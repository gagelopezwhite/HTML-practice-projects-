ty started with HTML. Why? HTML is the skeleton of all web pages. It's often the first language learned by developers, marketers, and designers and is core to front-end development work. If this is your first time touching code, we're excited for what you're about to create.\n\nSo what exactly is HTML? HTML provides structure to the content appearing on a website, such as images, text, or videos. Right-click on any page on the internet, choose “Inspect,” and you’ll see HTML in a panel of your screen. \n\nHTML stands for HyperText Markup Language:\n-  A *markup* language is a computer language that defines the structure and presentation of raw text.\n-  In HTML, the computer can interpret *raw text* that is wrapped in HTML elements.\n-  *HyperText* is text displayed on a computer or device that provides access to other text through links, also known as *hyperlinks*. You probably clicked on a couple of hyperlinks on your way to this Codecademy course.\n\nLearning HTML is the first step in creating websites, but even a bit of knowledge can help you inject code snippets into newsletter, blog or website templates. As you continue learning, you can layer HTML with CSS and JavaScript to create visually compelling and dynamic websites. But for now, we're going to focus on how to add and modify basic content on a page, like text, images, and videos. Don't worry if the websites look ugly \u0026mdash; we're just getting started.\n","instructions":null},"Exercise:adf3729b64a9a2e9f65e0b2a52dde38a":{"__typename":"Exercise","id":"adf3729b64a9a2e9f65e0b2a52dde38a","sourceId":null,"title":"Introduction to HTML","slug":"intro","published":true,"setupCommand":null,"createdAt":"2018-11-13T14:13:17Z","checkpoints":[{"__ref":"Checkpoint:5c2fe51a39652c546d53650d"}],"einConfig":{"title":"Static (Web)","description":"This workspace type includes only the essentials, and is to be used if no language dependencies are needed. It starts a static fileserver on port 4001 to serve workspace files to the Browser component.","container_type":"static-web","server":"http","image":"static-web","supports_ai_coding_harness":false},"updatedAt":"2022-10-03T22:15:38Z","workspace":{"__ref":"Workspace:5ea74d0e9be26d00153088c1"},"metrics":{"__typename":"ExerciseMetricsType","upperTimeToCompleteMinutes":4.28},"learningEnvironmentFeatures":{"__typename":"LearningEnvironmentFeature","enablePromptEngineeringChat":null},"layoutComponents":[{"__ref":"PersistentCodeEditor:5c2fe51a39652c546d536509"},{"__ref":"WebBrowser:5c2fe51a39652c546d53650a"},{"__ref":"Narrative:5c2fe51a39652c546d53650b"}]},"Workspace:61bb9a04cf66e20019f8d166":{"__typename":"Workspace","id":"61bb9a04cf66e20019f8d166","slug":"freelance1-U1L1E5","backendType":"static"},"Narrative:5c2fe51a39652c546d53650f":{"__typename":"Narrative","id":"5c2fe51a39652c546d53650f","type":"Narrative","content":"HTML is composed of [elements](https://www.codecademy.com/resources/docs/html/elements?page_ref=catalog). These elements structure the webpage and define its content. Let's take a look at how they're written.\n\nThe diagram to the right displays an HTML paragraph element. As we can see, the paragraph element is made up of:\n\n- An *opening tag* (`\u003cp\u003e`)\n- The content (“Hello World!” text)\n- A *closing tag* (`\u003c/p\u003e`)\n\nA *tag* and the *content* between it is called an HTML element. There are many tags that we can use to organize and display text and other types of content, like images. \n\nLet's quickly review each part of the element pictured:\n\n-  HTML element (or simply, element) \u0026mdash; a unit of content in an HTML document formed by HTML tags and the text or media it contains.\n\n- HTML Tag \u0026mdash; the element name, surrounded by an opening (`\u003c`) and closing (`\u003e`) angle bracket.\n\n- Opening Tag \u0026mdash; the first HTML tag used to start an HTML element. The tag type is surrounded by opening and closing angle brackets.\n\n- Content \u0026mdash; The information (text or other elements) contained between the opening and closing tags of an HTML element.\n\n- Closing tag \u0026mdash; the second HTML tag used to end an HTML element. Closing tags have a forward slash (`/`) inside of them, directly after the left angle bracket.\n\n\n\n\n","instructions":"Study the diagram to the right to learn about the anatomy of HTML syntax. When you're done, continue to the next exercise."},"LayoutImage:5c2fe51a39652c546d53650e":{"__typename":"LayoutImage","id":"5c2fe51a39652c546d53650e","type":"Image","imageUrl":"https://content.codecademy.com/courses/learn-html/elements-and-structure/html%20lesson%20image.svg","altText":"HTML Element Diagram"},"Exercise:64db5f5aee82171ed1625b5986654b7c":{"__typename":"Exercise","id":"64db5f5aee82171ed1625b5986654b7c","sourceId":null,"title":"HTML Anatomy","slug":"anatomy-html","published":true,"setupCommand":null,"createdAt":"2018-11-13T14:13:17Z","checkpoints":[],"einConfig":{"title":"Static","description":"Deprecated. Use Static (Web) for browser-based content or a specific language workspace.","deprecated":true,"extensions":{"c":{"cmds":["gcc-7 -o run *.c -pthread -lm","./run"],"post":["rm run"]},"cpp":{"cmds":["g++-7 -o run *.cpp","./run"],"post":["rm run"]},"dotnet":{"cmds":["dotnet run"],"post":["rm -rf obj/ bin/"]},"go":{"cmds":["go build -o run {{ .fileName }}","./run"],"post":["rm run"]},"java":{"cmds":["javac {{ .fileName }}","java {{ .fileName | replace \".java\" \"\" }}"],"post":["rm *pid*log"]},"js":{"cmds":["node {{ .fileName }}"]},"lol":{"cmds":["lci {{ .fileName }}"]},"lua":{"cmds":["lua {{ .fileName }}"]},"py":{"cmds":["python3 {{ .fileName }}"],"post":[]},"py2":{"cmds":["python {{ .fileName }}"]},"php":{"cmds":["php {{ .fileName }}"]},"r":{"cmds":["R -q -f {{ .fileName }}"]},"rb":{"cmds":["ruby {{ .fileName }}"]},"rmd":{"cmds":["R -q -e 'rmarkdown::render(\"{{ .fileName }}\", clean=TRUE, output_format=\"html_notebook\")'"]},"swift":{"cmds":["swift {{ .fileName }}"]},"golang":{"cmds":["go build -o run {{ n all browsers is to ensure that your elements remain within the opening and closing body tags.","hint":"It should look something like:\n\n```html\n\u003cbody\u003e\n  \u003cp\u003e\"Life is very short and what we have to do must be done in the now.\" - Audre Lorde\u003c/p\u003e\n\u003c/body\u003e\n```","testType":"componentTest","testCode":"if (Components.CodeEditor.codeContains('index.html', /\u003cbody\\s*\u003e.*\u003cp\\s*\u003e\\s*.+\\s*\u003c\\/\\s*p\\s*\u003e/s)) {\n  return { pass: true };\n}\nreturn {\n  pass: false,\n  errors: {\n    friendly: 'Did you add the paragraph under the opening `\u003cbody\u003e` tag?',\n    component: 'PersistentCodeEditor'\n  }\n};","testOptions":{}},"Workspace:5fd018b92957060013cfeae8":{"__typename":"Workspace","id":"5fd018b92957060013cfeae8","slug":"learn-html-elements-intro-to-html-body-html","backendType":"static-web"},"PersistentCodeEditor:5c2fe51a39652c546d536511":{"__typename":"PersistentCodeEditor","id":"5c2fe51a39652c546d536511","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"WebBrowser:5c2fe51a39652c546d536512":{"__typename":"WebBrowser","id":"5c2fe51a39652c546d536512","type":"WebBrowser","displayUrl":"localhost:8000"},"Narrative:5c2fe51a39652c546d536513":{"__typename":"Narrative","id":"5c2fe51a39652c546d536513","type":"Narrative","content":"One of the key HTML elements we use to build a webpage is the *body* element. Only content inside the opening and closing body tags can be displayed to the screen. Here's what opening and closing body tags look like:\n```html\n\u003cbody\u003e\n\n\u003c/body\u003e\n```\n\nOnce the file has a body, many different types of content – including text, images, and buttons – can be added to the body. \n\n```html\n\u003cbody\u003e\n  \u003cp\u003eWhat's up, doc?\u003c/p\u003e\n\u003c/body\u003e\n```\n","instructions":null},"Exercise:cbb06abe81be36990bd1345b37d4ea6d":{"__typename":"Exercise","id":"cbb06abe81be36990bd1345b37d4ea6d","sourceId":null,"title":"The Body","slug":"body-html","published":true,"setupCommand":"","createdAt":"2018-11-13T14:13:17Z","checkpoints":[{"__ref":"Checkpoint:5c2fe51a39652c546d536515"},{"__ref":"Checkpoint:5c2fe51a39652c546d536516"}],"einConfig":{"title":"Static (Web)","description":"This workspace type includes only the essentials, and is to be used if no language dependencies are needed. It starts a static fileserver on port 4001 to serve workspace files to the Browser component.","container_type":"static-web","server":"http","image":"static-web","supports_ai_coding_harness":false},"updatedAt":"2023-03-24T18:25:08Z","workspace":{"__ref":"Workspace:5fd018b92957060013cfeae8"},"metrics":{"__typename":"ExerciseMetricsType","upperTimeToCompleteMinutes":5.32},"learningEnvironmentFeatures":{"__typename":"LearningEnvironmentFeature","enablePromptEngineeringChat":null},"layoutComponents":[{"__ref":"PersistentCodeEditor:5c2fe51a39652c546d536511"},{"__ref":"WebBrowser:5c2fe51a39652c546d536512"},{"__ref":"Narrative:5c2fe51a39652c546d536513"}]},"Checkpoint:5c2fe51a39652c546d53651b":{"__typename":"Checkpoint","id":"5c2fe51a39652c546d53651b","instructions":"Add the paragraph below as a child of the `div` element.\n\n```html\n\u003cp\u003eThis paragraph is a child of the div element and a grandchild of the body element\u003c/p\u003e\n```","hint":"","testType":"webSCT","testCode":"$expect('div').to.have('p', 'Did you add a `\u003cp\u003e` element as a child of the div?');","testOptions":{}},"Workspace:5dc033a5859f5700118a41b2":{"__typename":"Workspace","id":"5dc033a5859f5700118a41b2","slug":"learn-html-elements-intro-to-html-structure-html","backendType":"static-web"},"Narrative:5c2fe51a39652c546d536519":{"__typename":"Narrative","id":"5c2fe51a39652c546d536519","type":"Narrative","content":"HTML is organized as a collection of family tree relationships. As you saw in the last exercise, we placed `\u003cp\u003e` tags within `\u003cbody\u003e` tags.  When an element is contained inside another element, it is considered the *child* of that element. The child element is said to be *nested* inside the *parent* element.\n\n```html\n\u003cbody\u003e\n  \u003cp\u003eThis paragraph is a child of the body\u003c/p\u003e\n\u003c/body\u003e\n```\nIn the example above, the `\u003cp\u003e` element is nested inside the `\u003cbody\u003e` element. The `\u003cp\u003e` element is considered a child of the `\u003cbody\u003e` element, and the `\u003cbody\u003e` element is considered the parent. You can also see that we've added two spaces of indentation (using the \u003ckbd\u003espace\u003c/kbd\u003e bar) for better readability. \n\nSince there can be multiple levels of nesting, this analogy can be extended to grandchildren, great-grandchildren, and beyond. The relationship between elements and their ancestor and descendant elements is known as *hierarchy*.\n\nLet's consider a more complicated example that uses some new tags:\n\n``` html\n\u003cbody\u003e\n  \u003cdiv\u003e\n    \u003ch1\u003eSibling to p, but also grandchild of body\u003c/h1\u003e\n    \u003cp\u003eSibling to h1, but also grandchild of body\u003c/p\u003e\n  \u003c/div\u003e\n\u003c/body\u003e\n```\n\nIn this example, the `\u003cbody\u003e` element is the parent of the `\u003cdiv\u003e` element. Both the `\u003ch1\u003e` and `\u003cp\u003e` elements are children of the `\u003cdiv\u003e` element. Because the `\u003ch1\u003e` and `\u003cp\u003e` elements are at the same level, they are considered siblings and are both grandchildren of the `\u003cbody\u003e` element.\n\nUnderstanding HTML hierarchy is important because child elements can inherit behavior and styling from their parent element. You'll learn more about webpage hierarchy when you start digging into CSS.\n\n","instructions":null},"WebBrowser:5c2fe51a39652c546d536517":{"__typename":"WebBrowser","id":"5c2fe51a39652c546d536517","type":"WebBrowser","displayUrl":"localhost:8000"},"PersistentCodeEditor:5c2fe51a39652c546d536518":{"__typename":"Pers estOptions":{}},"Workspace:61bbabee1f9f4a000e7adacd":{"__typename":"Workspace","id":"61bbabee1f9f4a000e7adacd","slug":"learn-html-elements-intro-to-html-headings-html-v2","backendType":"static-web"},"Narrative:5c2fe51a39652c546d53651e":{"__typename":"Narrative","id":"5c2fe51a39652c546d53651e","type":"Narrative","content":"Headings in HTML are similar to headings in other types of media. For example, in newspapers, large headings are typically used to capture a reader's attention. Other times, headings are used to describe content, like the title of a movie or an educational article. \n\nHTML follows a similar pattern. In HTML, there are six different *headings*, or *heading elements*. [Headings](https://www.codecademy.com/resources/docs/html/headings?page_ref=catalog) can be used for a variety of purposes, like titling sections, articles, or other forms of content.\n\nThe following is the list of heading elements available in HTML. They are ordered from largest to smallest in size.\n\n1. `\u003ch1\u003e` \u0026mdash; used for main headings. All other smaller headings are used for subheadings.\n2. `\u003ch2\u003e`\n3. `\u003ch3\u003e`\n4. `\u003ch4\u003e`\n5. `\u003ch5\u003e`\n6. `\u003ch6\u003e`\n\nThe following example code uses a headline intended to capture a reader's attention. It uses the largest heading available, the main heading element:\n\n```html\n\u003ch1\u003eBREAKING NEWS\u003c/h1\u003e\n```","instructions":null},"PersistentCodeEditor:5c2fe51a39652c546d53651c":{"__typename":"PersistentCodeEditor","id":"5c2fe51a39652c546d53651c","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"WebBrowser:5c2fe51a39652c546d53651d":{"__typename":"WebBrowser","id":"5c2fe51a39652c546d53651d","type":"WebBrowser","displayUrl":"localhost:8000/"},"Exercise:c290915cef31a066d79571b26c01f6e8":{"__typename":"Exercise","id":"c290915cef31a066d79571b26c01f6e8","sourceId":null,"title":"Headings","slug":"headings-html","published":true,"s eader `Media`?',\n          component: 'PersistentCodeEditor'\n        }\n      };","testOptions":{}},"Workspace:5f2492b58a5017001359891f":{"__typename":"Workspace","id":"5f2492b58a5017001359891f","slug":"learn-html-elements-intro-to-html-div-html","backendType":"static-web"},"WebBrowser:5c2fe51a39652c546d536525":{"__typename":"WebBrowser","id":"5c2fe51a39652c546d536525","type":"WebBrowser","displayUrl":"localhost:8000/"},"Narrative:5c2fe51a39652c546d536526":{"__typename":"Narrative","id":"5c2fe51a39652c546d536526","type":"Narrative","content":"One of the most popular elements in HTML is the `\u003cdiv\u003e` element. [`\u003cdiv\u003e`](https://www.codecademy.com/resources/docs/html/elements/div?page_ref=catalog) is short for \"division\" or a container that divides the page into sections. These sections are very useful for grouping elements in your HTML together. \n\n```html\n\u003cbody\u003e\n  \u003cdiv\u003e\n    \u003ch1\u003eWhy use divs?\u003c/h1\u003e\n    \u003cp\u003eGreat for grouping elements!\u003c/p\u003e\n  \u003c/div\u003e\n\u003c/body\u003e\n``` \n`\u003cdiv\u003e`s don't inherently have a visual representation, but they are very useful when we want to apply custom styles to our HTML elements. `\u003cdiv\u003e`s allow us to group HTML elements to apply the same styles for all HTML elements inside. We can also style the `\u003cdiv\u003e` element as a whole. You can see how this can be done in the [Learn CSS](https://www.codecademy.com/learn/learn-css) course.\n\n`\u003cdiv\u003e`s can contain any text or other HTML elements, such as links, images, or videos. Remember to always add two spaces of indentation when you nest elements inside of `\u003cdiv\u003e`s for better readability. \n","instructions":null},"PersistentCodeEditor:5c2fe51a39652c546d536524":{"__typename":"PersistentCodeEditor","id":"5c2fe51a39652c546d536524","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"Exercise:3316b386792fc510bedd112 r introduction div surrounding the `Species` `\u003ch3\u003e`?');\n\n$expect('div#introduction h3').any(function (h3) {\n  $expect(h3).to.contain('Features');\n}, 'Is your introduction div surrounding the `Features` `\u003ch3\u003e`?');","testOptions":{}},"Checkpoint:5c2fe51a39652c546d536530":{"__typename":"Checkpoint","id":"5c2fe51a39652c546d536530","instructions":"Add an `id` attribute with the value `\"habitat\"` to the opening `\u003cdiv\u003e` tag that has the `Habitat` `\u003ch2\u003e` heading as a child.","hint":"","testType":"webSCT","testCode":"$expect('div#habitat').to.exist('Did you add a div with `id=\"habitat\"`?');\n\n$expect('div#habitat h2').any(function (h2) {\n  $expect(h2).to.contain('Habitat');\n}, 'Is your habitat div surrounding the `Habitat` `\u003ch2\u003e`?');\n\n$expect('div#habitat h3').any(function (h3) {\n  $expect(h3).to.contain('Countries with Large Brown Bear Populations');\n}, 'Is your habitat div surrounding the `Countries with Large Brown Bear Populations` `\u003ch3\u003e`?');\n\n$expect('div#habitat h3').any(function (h3) {\n  $expect(h3).to.contain('Countries with Small Brown Bear Populations');\n}, 'Is your habitat div surrounding the `Countries with Large Brown Bear Populations` `\u003ch3\u003e`?');","testOptions":{}},"Checkpoint:5c2fe51a39652c546d536531":{"__typename":"Checkpoint","id":"5c2fe51a39652c546d536531","instructions":"Add an `id` attribute with the value `\"media\"` to the opening `\u003cdiv\u003e` tag that has the `Media` `\u003ch2\u003e` heading as a child.\n\n","hint":"","testType":"webSCT","testCode":"$expect('div#media').to.exist(\"Did you add a div with id='media'?\");\n\n$expect('div#media h2').any(function (h2) {\n  $expect(h2).to.contain('Media');\n}, 'Is your media div surrounding the `Media` `\u003ch2\u003e`?');","testOptions":{}},"Workspace:61bbb0819ee017000e4c11ed":{"__typename":"Workspace","id":"61bbb0819ee017000e4c11ed","slug":"learn-html-elements-intro-to-html-attr-html","backendType":"static-web"},"Narrative:5c2fe51a39652c546d53652d":{"__typename":"Narrative","id":"5c2fe51a39652c546d53652d","type":"Narrative","content":"If we want to expand an element's tag, we can do so using an attribute. [Attributes](https://www.codecademy.com/resources/docs/html/attributes?page_ref=catalog) are content added to the opening tag of an element and can be used in several different ways, from providing information to changing styling. Attributes are made up of the following two parts: \n\n- The _name_ of the attribute \n- The _value_ of the attribute\n\n\nOne commonly used attribute is the `id`. We can use the `id` attribute to specify different content (such as `\u003cdiv\u003e`s) and is really helpful when you use an element more than once. `id`s have several different purposes in HTML, but for now, we'll focus on how they can help us identify content on our page. \n\nWhen we add an `id` to a `\u003cdiv\u003e`, we place it in the opening tag:\n\n```html\n\u003cdiv id=\"intro\"\u003e\n  \u003ch1\u003eIntroduction\u003c/h1\u003e\n\u003c/div\u003e\n```","instructions":null},"PersistentCodeEditor:5c2fe51a39652c546d53652b":{"__typename":"PersistentCodeEditor","id":"5c2fe51a39652c546d53652b","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"WebBrowser:5c2fe51a39652c546d53652c":{"__typename":"WebBrowser","id":"5c2fe51a39652c546d53652c","type":"WebBrowser","displayUrl":"localhost:8000/"},"Exercise:c9e54da9b613f65ed0e478f1cb533cf2":{"__typename":"Exercise","id":"c9e54da9b613f65ed0e478f1cb533cf2","sourceId":null,"title":"Attributes","slug":"attr-html","published":true,"setupCommand":null,"createdAt":"2018-11-13T14:13:17Z","checkpoints":[{"__ref":"Checkpoint:5c2fe51a39652c546d53652f"},{"__ref":"Checkpoint:5c2fe51a39652c546d536530"},{"__ref":"Checkpoint:5c2fe51a39652c546d536531"}],"einConfig":{"title":"Static (Web)","description":"This workspace type includes only the essentials, and is to be used if no language dependencies are needed. It ns":"Under the `\u003ch3\u003e` element that says: \n\n`Countries with Small Brown Bear Populations`\n\nAdd a paragraph with the following text:\n\n\u003e Some countries with smaller brown bear populations include Armenia, Belarus, Bulgaria, China, Finland, France, Greece, India, Japan, Nepal, Poland, Romania, Slovenia, Turkmenistan, and Uzbekistan.","hint":"","testType":"webSCT","testCode":"var paragraphText = 'Some countries with smaller brown bear populations include Armenia, Belarus, Bulgaria, China, Finland, France, Greece, India, Japan, Nepal, Poland, Romania, Slovenia, Turkmenistan, and Uzbekistan.';\n\nvar locationRegExp = /\u003ch3\\s*\\n*\u003e\\s*[^]*\\s*\u003c\\/p\\s*\\n*\u003e/\n\n$expect('div#habitat p').to.exist(\"Did you add a `\u003cp\u003e` tag in the habitat `\u003cdiv\u003e`?\");\n\n$expect('div#habitat p').to.contain(paragraphText, 'Did you add the given text inside your `\u003cp\u003e\u003c/p\u003e` tag?');\n\n$expect('div#habitat').to.matchHtml(locationRegExp, 'Did you add your `\u003cp\u003e` below `Countries with Small Brown Bear Populations`?');","testOptions":{}},"Workspace:60da9cf842ff32001440b906":{"__typename":"Workspace","id":"60da9cf842ff32001440b906","slug":"learn-html-elements-intro-to-html-text-content-tags","backendType":"static"},"PersistentCodeEditor:5c2fe51a39652c546d536532":{"__typename":"PersistentCodeEditor","id":"5c2fe51a39652c546d536532","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"Narrative:5c2fe51a39652c546d536534":{"__typename":"Narrative","id":"5c2fe51a39652c546d536534","type":"Narrative","content":"If you want to display text in HTML, you can use a *paragraph* or *span*:\n- [*Paragraphs* (`\u003cp\u003e`)](https://www.codecademy.com/resources/docs/html/elements/p) contain a block of plain text.\n- [`\u003cspan\u003e`](https://www.codecademy.com/resources/docs/html/elements/span?page_ref=catalog) contains short pieces of text or other HTML. They are used to separate small pieces of content that are on the same line as other content.\n\nTake a look at each of these elements in action below:\n\n```html\n\u003cdiv\u003e\n  \u003ch1\u003eTechnology\u003c/h1\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003cp\u003e\u003cspan\u003eSelf-driving cars\u003c/span\u003e are anticipated to replace up to 2 million jobs over the next two decades.\u003c/p\u003e\n\u003c/div\u003e\n```\n\nIn the example above, there are two different `\u003cdiv\u003e` elements. The second `\u003cdiv\u003e` contains a `\u003cp\u003e` with `\u003cspan\u003eSelf-driving cars\u003c/span\u003e`. \nThis `\u003cspan\u003e` element separates \"Self-driving cars\" from the rest of the text in the paragraph. \n\nIt's best to use a `\u003cspan\u003e` element when you want to target a specific piece of content that is *inline*, or on the same line as other text. If you want to divide your content into *blocks*, it's better to use a `\u003cdiv\u003e`.\n","instructions":null},"WebBrowser:5c2fe51a39652c546d536533":{"__typename":"WebBrowser","id":"5c2fe51a39652c546d536533","type":"WebBrowser","displayUrl":"localhost:8000/"},"Exercise:725ae2a467dc3fd3fa3e67705e147410":{"__typename":"Exercise","id":"725ae2a467dc3fd3fa3e67705e147410","sourceId":null,"title":"Displaying Text","slug":"text-content-tags","published":true,"setupCommand":null,"createdAt":"2018-11-13T14:13:17Z","checkpoints":[{"__ref":"Checkpoint:5c2fe51a39652c546d536536"},{"__ref":"Checkpoint:5c2fe51a39652c546d536537"},{"__ref":"Checkpoint:5c2fe51a39652c546d536538"}],"einConfig":{"title":"Static","description":"Deprecated. Use Static (Web) for browser-based content or a specific language workspace.","deprecated":true,"extensions":{"c":{"cmds":["gcc-7 -o run *.c -pthread -lm","./run"],"post":["rm run"]},"cpp":{"cmds":["g++-7 -o run *.cpp","./run"],"post":["rm run"]},"dotnet":{"cmds":["dotnet run"],"post":["rm -rf obj/ bin/"]},"go":{"cmds":["go build -o run {{ .fileName }}","./run"],"post":["rm run"]},"java":{"cmds":[" e };\n      }\n      return {\n        pass: false,\n        errors: {\n          friendly: 'Did you wrap `Ursus arctos` (not including parentheses) with an `\u003cem\u003e\u003c/em\u003e` tag?',\n          component: 'PersistentCodeEditor'\n        }\n      };","testOptions":{}},"Checkpoint:5c2fe51a39652c546d53653e":{"__typename":"Checkpoint","id":"5c2fe51a39652c546d53653e","instructions":"In the paragraph under `About Brown Bears`, make the words `Least Concern` strong using the `\u003cstrong\u003e` tag. ","hint":"","testType":"componentTest","testCode":"      if (Components.CodeEditor.codeContains('index.html', /\u003cstrong\u003e[^]*\u003c\\/strong\u003e/)) {\n        return { pass: true };\n      }\n      return {\n        pass: false,\n        errors: {\n          friendly: 'Did you wrap `Least Concern` with a `\u003cstrong\u003e\u003c/strong\u003e` tag?',\n          component: 'PersistentCodeEditor'\n        }\n      };","testOptions":{}},"Workspace:5c2fe51a39652c546d53653c":{"__typename":"Workspace","id":"5c2fe51a39652c546d53653c","slug":"learn-html-elements-intro-to-html-text-style-tags","backendType":"static"},"Narrative:5c2fe51a39652c546d53653b":{"__typename":"Narrative","id":"5c2fe51a39652c546d53653b","type":"Narrative","content":"You can also style text using HTML tags. The `\u003cem\u003e` tag emphasizes text, while the `\u003cstrong\u003e` tag highlights important text. \n\nLater, when you begin to style websites, you will decide how you want browsers to display content within `\u003cem\u003e` and `\u003cstrong\u003e` tags. Browsers, however, have built-in style sheets that will generally style these tags in the following ways: \n\n- The `\u003cem\u003e` tag will generally render as *italic* emphasis.\n- The `\u003cstrong\u003e` will generally render as **bold** emphasis.\n\n\nTake a look at each style in action:\n\n```html\n\u003cp\u003e\u003cstrong\u003eThe Nile River\u003c/strong\u003e is the \u003cem\u003elongest\u003c/em\u003e river in the world, measuring over 6,850 kilometers long (approximately 4,260 miles).\u003c/p\u003e\n```\n\nIn this example, the `\u003cstrong\u003e` and `\u003cem\u003e` tags are used to emphasize the text to produce the following:\n\n\n**The Nile River** is the *longest* river in the world, measuring over 6,850 kilometers long (approximately 4,260 miles).\n\n\nAs we can see, \"The Nile River\" is bolded and \"longest\" is in italics.\n\n","instructions":null},"PersistentCodeEditor:5c2fe51a39652c546d536539":{"__typename":"PersistentCodeEditor","id":"5c2fe51a39652c546d536539","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"WebBrowser:5c2fe51a39652c546d53653a":{"__typename":"WebBrowser","id":"5c2fe51a39652c546d53653a","type":"WebBrowser","displayUrl":"localhost:8000/"},"Exercise:802cb9aab5a33324f9f6af4a434364e8":{"__typename":"Exercise","id":"802cb9aab5a33324f9f6af4a434364e8","sourceId":null,"title":"Styling Text","slug":"text-style-tags","published":true,"setupCommand":null,"createdAt":"2018-11-13T14:13:17Z","checkpoints":[{"__ref":"Checkpoint:5c2fe51a39652c546d53653d"},{"__ref":"Checkpoint:5c2fe51a39652c546d53653e"}],"einConfig":{"title":"Static","description":"Deprecated. Use Static (Web) for browser-based content or a specific language workspace.","deprecated":true,"extensions":{"c":{"cmds":["gcc-7 -o run *.c -pthread -lm","./run"],"post":["rm run"]},"cpp":{"cmds":["g++-7 -o run *.cpp","./run"],"post":["rm run"]},"dotnet":{"cmds":["dotnet run"],"post":["rm -rf obj/ bin/"]},"go":{"cmds":["go build -o run {{ .fileName }}","./run"],"post":["rm run"]},"java":{"cmds":["javac {{ .fileName }}","java {{ .fileName | replace \".java\" \"\" }}"],"post":["rm *pid*log"]},"js":{"cmds":["node {{ .fileName }}"]},"lol":{"cmds":["lci {{ .fileName }}"]},"lua":{"cmds":["lua {{ .fileName }}"]},"py":{"cmds":["python3 {{ .fileName }}"],"post":[]},"py2":{"cmds":["python {{ .fileName }}"]},"php":{"cmds":["php {{ .fileName }}"]},"r":{"cmds":["R -q -f {{ .fi pace:5e8dd11cd8bc4b0018681c03":{"__typename":"Workspace","id":"5e8dd11cd8bc4b0018681c03","slug":"learn-html-elements-intro-to-html-unordered-lists-html","backendType":"static"},"PersistentCodeEditor:5c2fe51b39652c546d536544":{"__typename":"PersistentCodeEditor","id":"5c2fe51b39652c546d536544","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"WebBrowser:5c2fe51b39652c546d536545":{"__typename":"WebBrowser","id":"5c2fe51b39652c546d536545","type":"WebBrowser","displayUrl":"localhost:8000/"},"Narrative:5c2fe51b39652c546d536546":{"__typename":"Narrative","id":"5c2fe51b39652c546d536546","type":"Narrative","content":"In addition to organizing text in paragraph form, you can also display content in an easy-to-read list.\n\nIn HTML, you can use an *unordered list* tag (`\u003cul\u003e`) to create a list of items in no particular order. An unordered list outlines individual *list items* with a bullet point.\n\nThe [`\u003cul\u003e` element](https://www.codecademy.com/resources/docs/html/elements/ul?page_ref=catalog) should not hold raw text and won't automatically format raw text into an unordered list of items. Individual list items must be added to the unordered list using the `\u003cli\u003e` tag. The `\u003cli\u003e` or list item tag is used to describe an item in a list.\n\n```html\n\u003cul\u003e\n  \u003cli\u003eLimes\u003c/li\u003e\n  \u003cli\u003eTortillas\u003c/li\u003e\n  \u003cli\u003eChicken\u003c/li\u003e\n\u003c/ul\u003e\n```\n\nIn the example above, the list was created using the `\u003cul\u003e` tag and all individual list items were added using `\u003cli\u003e` tags.\n\nThe output will look like this:\n\n- Limes\n- Tortillas\n- Chicken","instructions":null},"Exercise:741dc2317eec67d6df20a0a8f5e82cdb":{"__typename":"Exercise","id":"741dc2317eec67d6df20a0a8f5e82cdb","sourceId":null,"title":"Unordered Lists","slug":"unordered-lists-html","published":true,"setupCommand":null,"createdAt":"2018-11-13T14:13:17Z","che /;\n\n$expect('div#habitat').to.matchHtml(orderRegExp, 'Did you put your list items in the order: `Russia`, `United States`, `Canada?`');\n  ","testOptions":{}},"Workspace:5c2fe51b39652c546d53654d":{"__typename":"Workspace","id":"5c2fe51b39652c546d53654d","slug":"learn-html-elements-intro-to-html-ordered-lists-html","backendType":"static"},"WebBrowser:5c2fe51b39652c546d53654b":{"__typename":"WebBrowser","id":"5c2fe51b39652c546d53654b","type":"WebBrowser","displayUrl":"localhost:8000/"},"PersistentCodeEditor:5c2fe51b39652c546d53654a":{"__typename":"PersistentCodeEditor","id":"5c2fe51b39652c546d53654a","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"Narrative:5c2fe51b39652c546d53654c":{"__typename":"Narrative","id":"5c2fe51b39652c546d53654c","type":"Narrative","content":"[*Ordered lists* (`\u003col\u003e`)](https://www.codecademy.com/resources/docs/html/elements/ol?page_ref=catalog) are like unordered lists, except that each list item is numbered. They are useful when you need to list different steps in a process or rank items from first to last. \n\n\nYou can create the ordered list with the `\u003col\u003e` tag and then add individual list items to the list using `\u003cli\u003e` tags.\n\n```html\n\u003col\u003e\n  \u003cli\u003ePreheat the oven to 350 degrees.\u003c/li\u003e\n  \u003cli\u003eMix whole wheat flour, baking soda, and salt.\u003c/li\u003e\n  \u003cli\u003eCream the butter and sugar in a separate bowl.\u003c/li\u003e\n  \u003cli\u003eAdd eggs and vanilla extract to the bowl.\u003c/li\u003e\n\u003c/ol\u003e\n```\n\nThe output will look like this:\n\u003col\u003e\n  \u003cli\u003ePreheat the oven to 350 degrees.\u003c/li\u003e\n  \u003cli\u003eMix whole wheat flour, baking soda, and salt.\u003c/li\u003e\n  \u003cli\u003eCream the butter and sugar in a separate bowl.\u003c/li\u003e\n  \u003cli\u003eAdd eggs and vanilla extract to the bowl.\u003c/li\u003e\n\u003c/ol\u003e","instructions":null},"Exercise:8bd pace:5c2fe51b39652c546d53654d"},"metrics":{"__typename":"ExerciseMetricsType","upperTimeToCompleteMinutes":4.02},"learningEnvironmentFeatures":{"__typename":"LearningEnvironmentFeature","enablePromptEngineeringChat":null},"layoutComponents":[{"__ref":"WebBrowser:5c2fe51b39652c546d53654b"},{"__ref":"PersistentCodeEditor:5c2fe51b39652c546d53654a"},{"__ref":"Narrative:5c2fe51b39652c546d53654c"}]},"Checkpoint:5c2fe51b39652c546d536554":{"__typename":"Checkpoint","id":"5c2fe51b39652c546d536554","instructions":"Under the `Media` `\u003ch2\u003e` heading, add an image. Use the following URL as the source (`src`) for the image: \n\n```\nhttps://content.codecademy.com/courses/web-101/web101-image_brownbear.jpg\n```","hint":"Make sure to wrap your link in quotation marks:\n```html\n\u003cimg src=\"URL\" /\u003e```","testType":"componentTest","testCode":"      if (Components.CodeEditor.codeContains('index.html', /\\s*\u003c\\/h2\u003e\\s*\u003cimg\\s+src\\s*=\\s*(['\"])https:\\/\\/content\\.codecademy\\.com\\/courses\\/web-101\\/web101-image_brownbear\\.jpg\\1\\s*\\/?\u003e/)) {\n        return { pass: true };\n      }\n      return {\n        pass: false,\n        errors: {\n          friendly: 'Did you set the image\\'s source to the given URL?',\n          component: 'PersistentCodeEditor'\n        }\n      };","testOptions":{}},"Workspace:61bbbc661f9f4a001c7adefe":{"__typename":"Workspace","id":"61bbbc661f9f4a001c7adefe","slug":"learn-html-elements-intro-to-html-img-src-html","backendType":"static"},"Narrative:5c2fe51b39652c546d536552":{"__typename":"Narrative","id":"5c2fe51b39652c546d536552","type":"Narrative","content":"All of the elements you've learned about so far (headings, paragraphs, lists, and spans) share one thing in common: they're composed entirely of text! What if you want to add content to your web page that isn't composed of text, like [images](https://www.codecademy.com/resources/docs/html/images?page_ref=catalog)?\n\nThe `\u003cimg\u003e` tag allows you to add an image to a web page. Most elements require both opening and closing tags, but the `\u003cimg\u003e` tag is a *self-closing tag*. Note that the end of the `\u003cimg\u003e` tag has a forward slash `/`. Self-closing tags may include or omit the final slash \u0026mdash; both will render properly.  \n\n```html\n\u003cimg src=\"image-location.jpg\" /\u003e\n```\n\nThe `\u003cimg\u003e` tag has a required *attribute* called `src`. The `src` attribute must be set to the image's *source*, or the location of the image. In this case, the value of `src` must be the *uniform resource locator* (URL) of the image. A URL is the web address or local address where a file is stored.\n\n\n\n","instructions":null},"PersistentCodeEditor:5c2fe51b39652c546d536550":{"__typename":"PersistentCodeEditor","id":"5c2fe51b39652c546d536550","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"WebBrowser:5c2fe51b39652c546d536551":{"__typename":"WebBrowser","id":"5c2fe51b39652c546d536551","type":"WebBrowser","displayUrl":"localhost:8000/"},"Exercise:a68c01df9b0ab5ca267d6b9646cbfb56":{"__typename":"Exercise","id":"a68c01df9b0ab5ca267d6b9646cbfb56","sourceId":null,"title":"Images","slug":"img-src-html","published":true,"setupCommand":null,"createdAt":"2018-11-13T14:13:17Z","checkpoints":[{"__ref":"Checkpoint:5c2fe51b39652c546d536554"}],"einConfig":{"title":"Static","description":"Deprecated. Use Static (Web) for browser-based content or a specific language workspace.","deprecated":true,"extensions":{"c":{"cmds":["gcc-7 -o run *.c -pthread -lm","./run"],"post":["rm run"]},"cpp":{"cmds":["g++-7 -o run *.cpp","./run"],"post":["rm run"]},"dotnet":{"cmds":["dotnet run"],"post":["rm -rf obj/ bin/"]},"go":{"cmds":["go build -o run {{ .fileName }}","./run"],"post":["rm run"]},"java":{"cmds":["javac {{ .fileName }}","java {{ .fileName | replace \".java\" \"\" }}"],"post":["rm *pid*log"]},"js":{"cmds":["node {{ .fileName }}"]},"lol":{"cmds":["lci {{ .fileNam 2c546d536557":{"__typename":"Narrative","id":"5c2fe51b39652c546d536557","type":"Narrative","content":"Part of being an exceptional web developer is making your site accessible to users of all backgrounds. In order to make the Web more inclusive, we need to consider what happens when assistive technologies such as screen readers come across image tags.\n\nThe `alt` attribute, which means alternative text, brings meaning to the images on our sites. The `alt` attribute can be added to the image tag just like the `src` attribute.  The value of `alt` should be a description of the image. \n\n```html\n\u003cimg src=\"#\" alt=\"A field of yellow sunflowers\" /\u003e\n```\n\nThe `alt` attribute also serves the following purposes:\n\n-  If an image fails to load on a web page, a user can mouse over the area originally intended for the image and read a brief description of the image. This is made possible by the description you provide in the `alt` attribute.\n- Visually impaired users often browse the web with the aid of screen reading software. When you include the `alt` attribute, the screen reading software can read the image's description out loud to the visually impaired user.\n- \nThe `alt` attribute also plays a role in Search Engine Optimization (SEO), because search engines cannot \"see\" the images on websites as they crawl the internet. Having descriptive `alt` attributes can improve the ranking of your site. \n\n\nIf the image on the web page is not one that conveys any meaningful information to a user (visually impaired or otherwise), the `alt` attribute should be left empty.","instructions":null},"WebBrowser:5c2fe51b39652c546d536556":{"__typename":"WebBrowser","id":"5c2fe51b39652c546d536556","type":"WebBrowser","displayUrl":"localhost:8000/"},"PersistentCodeEditor:5c2fe51b39652c546d536555":{"__typename":"PersistentCodeEditor","id":"5c2fe51b39652c546d536555","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"Exerci ":"ExerciseMetricsType","upperTimeToCompleteMinutes":4.13},"learningEnvironmentFeatures":{"__typename":"LearningEnvironmentFeature","enablePromptEngineeringChat":null},"layoutComponents":[{"__ref":"Narrative:5c2fe51b39652c546d536557"},{"__ref":"WebBrowser:5c2fe51b39652c546d536556"},{"__ref":"PersistentCodeEditor:5c2fe51b39652c546d536555"}]},"Checkpoint:5c2fe51b39652c546d53655e":{"__typename":"Checkpoint","id":"5c2fe51b39652c546d53655e","instructions":"Under the image, create a `\u003cvideo\u003e` tag and add the following video url as the source:\n\n```\nhttps://content.codecademy.com/courses/freelance-1/unit-1/lesson-2/htmlcss1-vid_brown-bear.mp4\n```\n\nBe sure to create a closing tag as well with `\u003c/video\u003e`.","hint":"Here's an example video tag that would link to `myVideo.mp4` as the source:\n\n```html\n\u003cvideo src=\"myVideo.mp4\"\u003e\u003c/video\u003e\n```","testType":"componentTest","testCode":"      if (Components.CodeEditor.codeContains('index.html', /\u003cimg [^]*\\/\u003e\\s*\u003cvideo\\s+src\\s*=\\s*([\"'])https:\\/\\/content\\.codecademy\\.com\\/courses\\/freelance-1\\/unit-1\\/lesson-2\\/htmlcss1-vid_brown-bear\\.mp4\\1\\s*[^]*\u003e[^]*\u003c\\/video\u003e/)) {\n        return { pass: true };\n      }\n      return {\n        pass: false,\n        errors: {\n          friendly: 'After the `\u003cimg\u003e` element, did you create a `\u003cvideo\u003e` element that contains the provided video url?',\n          component: 'PersistentCodeEditor'\n        }\n      };","testOptions":{}},"Checkpoint:5c2fe51b39652c546d53655f":{"__typename":"Checkpoint","id":"5c2fe51b39652c546d53655f","instructions":"Define the  `width` of the video as `\"320\"` and the `height` as `\"240\"`.  Make sure to also include the `controls` attribute.","hint":"Here's how to define `height`, `width`, and the `controls` attribute for a video :\n```html\n\u003cvideo src=\"myVideo.mp4\" width=\"320\" height=\"240\" controls\u003e\u003c/video\u003e\n```","testType":"webSCT","testCode":"var vids = document.getElementsByTagName('video') \n\nvar rightVid = [].slice.call(vids).find(function(el) {\n   return el.src.includes(\"vid_brown-bear.mp4\") \n}) \n\nif(!rightVid) {\n  throw Error('Please don\\'t remove the `\u003cvideo\u003e` element that displayed the brown bear mp4.')\n}\n\nif(rightVid.width !== 320) {\n  throw Error('Did you add to the opening `\u003cvideo\u003e` tag a `width` attribute of `\"320\"`?')\n}\n\nif(rightVid.height !== 240) {\n  throw Error('Did you add to the opening `\u003cvideo\u003e` tag a `height` attribute of `\"240\"`?')\n}\n\nif(!rightVid.controls) {\n  throw Error('Did you add to the `\u003cvideo\u003e` tag a `controls` attribute?')\n}","testOptions":{}},"Checkpoint:5c2fe51b39652c546d536560":{"__typename":"Checkpoint","id":"5c2fe51b39652c546d536560","instructions":"In between the opening and closing `\u003cvideo\u003e` tags, add the phrase `Video not supported`, which will be displayed if the browser is unable to load your video.","hint":"","testType":"webSCT","testCode":"var vids = document.getElementsByTagName('video')\n\nvar rightVid = [].slice.call(vids).find(function (el) {\n  return el.src.includes(\"vid_brown-bear.mp4\")\n})\n\nif (!rightVid) {\n  throw Error('Please don\\'t remove the `\u003cvideo\u003e` element that displayed the brown bear mp4?')\n}\n\nif (!rightVid.innerHTML.match(/video\\s+not\\s+supported/i)) {\n  throw Error(\"Did you include the text `Video not supported` inside your `\u003cvideo\u003e` tags? It currently reads: `\" + rightVid.innerHTML + \"`\")\n}","testOptions":{}},"Workspace:61bbbd22293f700016dda6a0":{"__typename":"Workspace","id":"61bbbd22293f700016dda6a0","slug":"learn-html-elements-intro-to-html-videos-html","backendType":"static-web"},"Narrative:5c2fe51b39652c546d53655c":{"__typename":"Narrative","id":"5c2fe51b39652c546d53655c","type":"Narrative","content":"In addition to images, HTML also supports displaying [videos](https://www.codecademy.com/resources/docs/html/videos?page_ref=catalog). Like the `\u003cimg\u003e` element, the `\u003cvideo\u003e` element requires a `src` attribute with a link to the video source. Unlike the `\u003cimg\u003e` element however, the `\u003cvideo\u003e` element requires an opening and a closing tag. \n\n```html\n\u003cvideo src=\"myVideo.mp4\" width=\"320\" height=\"240\" controls\u003e\n  Video not supported\n\u003c/video\u003e\n```\n\nIn this example, the video source (`src`) is `\"myVideo.mp4\"`. The source can be a video file that is hosted alongside your webpage, or a URL that points to a video file hosted on another webpage.\n\nAfter the `src` attribute, the `width` and `height` attributes are used to set the size of the video displayed in the browser. The `controls` attribute instructs the browser to include basic video controls such as pausing and playing.\n\nThe text, `Video not supported`, between the opening and closing video tags will only be displayed if the browser is unable to load the video. \n\n\n\n","instructions":null},"WebBrowser:5c2fe51b39652c546d53655b":{"__typename":"WebBrowser","id":"5c2fe51b39652c546d53655b","type":"WebBrowser","displayUrl":"localhost:8000/"},"PersistentCodeEditor:5c2fe51b39652c546d53655a":{"__typename":"PersistentCodeEditor","id":"5c2fe51b39652c546d53655a","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"Exercise:ba9251038091665cb3e4f7bbf29f1d14":{"__typename":"Exercise","id":"ba9251038091665cb3e4f7bbf29f1d14","sourceId":null,"title":"Videos","slug":"videos-html","published":true,"setupCommand":"","createdAt":"2018-11-13T14:13:17Z","checkpoints":[{"__ref":"Checkpoint:5c2fe51b39652c546d53655e"},{"__ref":"Checkpoint:5c2fe51b39652c546d53655f"},{"__ref":"Checkpoint:5c2fe51b39652c546d536560"}],"einConfig":{"title":"Static (Web)","description":"This workspace type includes only the essentials, and is to be used if no language dependencies are needed. It starts a static fileserver on port 4001 to serve workspace files to the Browser component.","container_type":"static-web","server":"http","image":"static-web","supports_ai_coding_harness":false},"updatedAt":"2025-06-16T19:44:26Z","workspace":{"__ref":"Workspace:61bbbd22293f700016dda6a0"},"metrics":{"__typename":"ExerciseMetricsType","upperTimeToCompleteMinutes":8.07},"learningEnvironmentFeatures":{"__typename":"LearningEnvironmentFeature","enablePromptEngineeringChat":null},"layoutComponents":[{"__ref":"Narrative:5c2fe51b39652c546d53655c"},{"__ref":"WebBrowser:5c2fe51b39652c546d53655b"},{"__ref":"PersistentCodeEditor:5c2fe51b39652c546d53655a"}]},"Workspace:612e859faee8e50010ba6c9e":{"__typename":"Workspace","id":"612e859faee8e50010ba6c9e","slug":"learn-html-elements-intro-to-html-videos-html","backendType":"static"},"PersistentCodeEditor:5c2fe51b39652c546d536561":{"__typename":"PersistentCodeEditor","id":"5c2fe51b39652c546d536561","type":"PersistentCodeEditor","files":["index.html"],"navigatorDisabled":null,"noRunButton":null},"WebBrowser:5c2fe51b39652c546d536562":{"__typename":"WebBrowser","id":"5c2fe51b39652c546d536562","type":"WebBrowser","displayUrl":"localhost:8000"},"Narrative:5c2fe51b39652c546d536563":{"__typename":"Narrative","id":"5c2fe51b39652c546d536563","type":"Narrative","content":"Congratulations on completing the first lesson of HTML! You are well on your way to becoming a skilled web developer.\n\nLet's review what you've learned so far:\n\n- **HTML** stands for **H**yper**T**ext **M**arkup **L**anguage and is used to create the structure and content of a webpage.\n- Most HTML elements contain opening and closing tags with raw text or other HTML tags between them.\n- HTML elements can be nested inside other elements. The enclosed element is the child of the enclosing parent element.\n- Any visible content should be placed within the opening and closing `\u003cbody\u003e` tags.\n- Headings and sub-headings, `\u003ch1\u003e` to `\u003ch6\u003e` tags, are used to provide titles for sections of content. \n- `\u003cp\u003e`, `\u003cspan\u003e` and `\u003cdiv\u003e` tags specify text or blocks.\n- The `\u003cem\u003e` and `\u003cstrong\u003e` tags are used to emphasize text. \n- Line breaks are created with the `\u003cbr\u003e` tag. \n- Ordered lists (`\u003col\u003e`) are numbered and unordered lists (`\u003cul\u003e`) are bulleted. \n- Images (`\u003cimg\u003e`) and videos (`\u003cvideo\u003e`) can be added by linking to an existing source.\n\nHere are a few more resources to add to your toolkit:\n- [Codecademy Docs: HTML](https://www.codecademy.com/resources/docs/html)\n- [Codecademy Workspaces: HTML](https://www.codecademy.com/workspaces/new)\n\nMake sure to bookmark these links so you have them at your disposal.\n\nIn the next lesson, we'll take the content that you've added to this website and transform it into an HTML document that's ready to go on the web.","instructions":"We've left you with your final code. Feel free to play around and modify it using the new elements you've learned!\n\nIf you want to review how to structure HTML in a project and use semantically meaningful elements, watch the video below and follow along with one of our experts:\n\u003ciframe width=\"300\" height=\"200\" src=\"https://www.youtube.com/embed/uxmB8MlO3m8?rel=0\" frameborder=\"0\" allow=\"autoplay; encrypted-media\" allowfullscreen\u003e\u003c/iframe\u003e"},"Exercise:17189369dcbec862eadfe61cd4f2a3f2":{"__typename":"Exercise","id":"17189369dcbec862eadfe61cd4f2a3f2","sourceId":null,"title":"Review","slug":"review-html-structure","published":true,"setupCommand":null,"createdAt":"2018-11-13T14:13:17Z","checkpoints":[],"einConfig":{"title":"Static","description":"Deprecated. Use Static (Web) for browser-based content or a specific language workspace.","deprecated":true,"extensions":{"c":{"cmds":["gcc-7 -o run *.c -pthread -lm","./run"],"post":["rm run"]},"cpp":{"cmds":["g++-7 -o run *.cpp","./run"],"post":["rm run"]},"dotnet":{"cmds":["dotnet run"],"post":["rm -rf obj/ bin/"]},"go":{"cmds":
